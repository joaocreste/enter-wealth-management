#:schema node_modules/wrangler/config-schema.json
name = "enter-wealth-advisor"
main = "worker/src/index.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Advisor portal, client portal and the report viewer are served from the same
# Worker so the authorization boundary is enforced in one place (§24).
[assets]
directory = "web"
binding = "ASSETS"

[observability]
enabled = true

# The daily agents run here, on Cloudflare, so nothing depends on anyone's
# machine: every day at 10:00 UTC (07:00 in São Paulo) the Worker's scheduled
# handler rebuilds the World Overview for every advisor.
[triggers]
crons = ["0 10 * * *"]

# The agents themselves run as a Workflow: one durable step per agent, so a run
# that takes minutes (a model, a news scan) is not cut off the way background
# work started from an HTTP request is, and it survives the advisor closing the tab.
[[workflows]]
name = "enter-wealth-overview-agents"
binding = "OVERVIEW_AGENTS"
class_name = "OverviewAgents"

# ── D1: the relational record (§24, §25) ────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "enter-wealth"
database_id = "86ef1e84-12df-41a3-b23b-e8791c9906d6"
migrations_dir = "worker/migrations"

# ── R2: immutable generated artefacts — PDFs, HTML snapshots, charts ────────
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "enter-wealth-reports"

# ── R2: daily price histories of the monitored indicators (worker/src/series.js) ──
# Mutable, appended every morning by the cron; kept apart from the immutable artefacts.
[[r2_buckets]]
binding = "MARKET_SERIES"
bucket_name = "enter-wealth-market"

# ── KV: cached provider responses and low-latency reference data ────────────
# Never the authoritative store for a portfolio record.
[[kv_namespaces]]
binding = "MARKET_CACHE"
id = "092ceadc9f7b4b89b4fae38c42f17d77"

[vars]
# Safe by default. `development` relaxes the CORS allowlist to localhost and lets
# /api/admin/seed run without a token, so it must never be the deployed value —
# .dev.vars overrides this to "development" for `wrangler dev` only.
ENVIRONMENT = "production"
# Origins permitted to call this API from a browser. The portal is served from
# GitHub Pages, so every portal request is cross-origin. Never a wildcard.
ALLOWED_ORIGINS = "https://joaocreste.github.io"
REPORT_LOCALE = "pt-BR"
BASE_CURRENCY = "BRL"
# Set with: wrangler secret put ANTHROPIC_API_KEY
# ANTHROPIC_MODEL is a plain var so the model in use is visible in the audit trail.
ANTHROPIC_MODEL = "claude-opus-5"
LLM_PROMPT_VERSION = "letter-2026-09-a"
