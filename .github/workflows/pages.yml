# Publishes the redirect to GitHub Pages.
#
# The portal itself is served by the Cloudflare Worker, behind an access
# password the Worker checks before any page or asset (worker/src/gate.js).
# A static host cannot ask for a password, so this address only forwards there.
name: Deploy portal redirect to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
